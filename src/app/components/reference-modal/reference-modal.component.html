@if (store.selectedReference(); as ref) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-zinc-900/60 backdrop-blur-sm" (click)="store.closeReference()">
    <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden" (click)="$event.stopPropagation()">
      <div class="p-6 md:p-8">
        <div class="flex justify-between items-start mb-6">
          <div class="w-12 h-12 rounded-2xl bg-zinc-100 flex items-center justify-center text-zinc-600">
            <i class="fa-solid fa-book-bookmark text-xl"></i>
          </div>
          <button (click)="store.closeReference()" class="p-2 text-zinc-400 hover:text-zinc-600 transition-colors">
            <i class="fa-solid fa-xmark text-xl"></i>
          </button>
        </div>
        
        <h3 class="text-2xl font-bold text-zinc-900 mb-4">{{ ref.title }}</h3>
        <p class="text-zinc-600 leading-relaxed mb-8">
          {{ ref.description }}
        </p>
        
        <div class="flex flex-col sm:flex-row gap-3">
          <a [href]="ref.sourceUrl" target="_blank" class="btn-primary flex-1 justify-center">
            <i class="fa-solid fa-arrow-up-right-from-square mr-2"></i>
            View Official Source
          </a>
          <button (click)="store.closeReference()" class="btn-secondary flex-1 justify-center">
            Dismiss
          </button>
        </div>
      </div>
    </div>
  </div>
}
