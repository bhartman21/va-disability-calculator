<header class="flex flex-col md:flex-row md:items-end justify-between gap-4 pb-6 border-b border-zinc-100/50 mb-2">
  <div>
    <div class="flex items-center gap-2 text-zinc-500 mb-2">
      <i class="fa-solid fa-user-shield text-xs"></i>
      <span class="text-xs font-bold uppercase tracking-widest">Official Logic</span>
    </div>
    <div class="flex items-center gap-4">
      <h1 class="text-4xl md:text-5xl font-bold tracking-tight text-zinc-900">
        VA Disability <span class="text-zinc-400 font-light italic">Calculator</span>
      </h1>
      <button 
        (click)="store.toggleThemePicker()"
        class="hidden md:flex items-center justify-center w-10 h-10 rounded-full bg-theme-primary/10 hover:bg-theme-primary/20 text-theme-primary transition-colors border border-theme-border/20 shadow-sm group"
        title="Change Branch Theme"
      >
        <i class="fa-solid fa-palette group-hover:text-theme-accent transition-colors"></i>
      </button>
    </div>
  </div>
  <div class="text-right flex flex-col items-end">
    <button 
      (click)="store.toggleThemePicker()"
      class="md:hidden flex items-center justify-center w-10 h-10 rounded-full bg-theme-primary/10 text-theme-primary mb-4 border border-theme-border/20"
    >
      <i class="fa-solid fa-palette"></i>
    </button>
    <p class="text-sm text-zinc-500 max-w-xs">
      Calculates combined ratings based on the VA's "Whole Person Theory" and 38 CFR 4.25/4.26.
    </p>
  </div>
</header>
