<header
  class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 pb-4 border-b border-zinc-100/50 mb-4 overflow-hidden">
  <div class="flex flex-col justify-end">
    <div class="flex items-center gap-2 text-zinc-500 mb-2 group cursor-default">
      <i class="fa-solid fa-user-shield text-[10px] text-theme-primary/60 transition-colors group-hover:text-theme-primary"></i>
      <span class="text-[10px] font-bold uppercase tracking-[0.2em] transition-colors group-hover:text-zinc-700">Official Logic</span>
    </div>
    <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold tracking-tight text-zinc-900 leading-tight sm:leading-none">
      VA Disability <span class="text-zinc-400 font-light italic">Calculator</span>
    </h1>
  </div>

  <div class="flex items-center justify-end gap-3 md:gap-4 md:mb-1">
    <!-- Buy Me A Coffee (Desktop + Mobile fallback) -->
    <a href="https://www.buymeacoffee.com/bhartman21" 
      class="btn-primary !h-[32px] !w-[115px] !px-3 !py-0 !rounded-full !text-[10px] font-bold transition-all hover:scale-105 active:scale-95 shadow-sm hover:shadow-md flex items-center justify-center whitespace-nowrap" 
      title="Buy Me A Coffee"
      aria-label="Buy Me A Coffee">
      <span>☕ Buy me a coffee</span>
    </a>

    <!-- Theme Selection -->
    <button (click)="store.toggleThemePicker()"
      class="flex items-center justify-center w-10 h-10 rounded-full bg-theme-primary/5 hover:bg-theme-primary/15 text-theme-primary transition-all border border-theme-border/10 shadow-sm hover:shadow-md group active:scale-95"
      title="Change Branch Theme"
      aria-label="Change Branch Theme">
      <i class="fa-solid fa-palette group-hover:text-theme-accent transition-transform group-hover:rotate-12"></i>
    </button>
  </div>
</header>

<div class="text-center max-w-4xl mx-auto px-4 py-2 pb-6">
  <p class="text-xs sm:text-sm md:text-base text-zinc-500 leading-relaxed font-light italic">
    Calculates combined ratings based on the VA's <span class="text-theme-primary font-bold not-italic">"Whole Person
      Theory"</span> and 38 CFR 4.25/4.26.
  </p>
</div>
